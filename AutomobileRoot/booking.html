<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="icon" type="image/x-icon" href="/assets/icon-last.png">
    <link rel="stylesheet" href="/styling/booking.css">
</head>
<body>
    <header>
        <nav class="logo-group">
        <div class="home-nav">
            <a href="index.html" target="_self" id="main-nohover"><img src="/assets/icon.png" class="logo-icon">AutoMobile-Mechanic</img></a>
        </div>
        <div class="nav-links">
            <a href="services.html" target="_self" class="navi">Services</a>
            <a href="booking.html" target="_self" class="navi">Booking</a>
            <a href="mailto:contact@automobile.co.in" class="navi">contact@automobile.co.in</a>
            <a href="tel:+91999-999-9999" class="navi">999-999-9999</a>
        </div>
    </nav>
    </header>
    <main>
        <h2>Book <span id="heading-color">Your</span> Sevice</h2>
        <form action="abc.php" >
            <div class="group-container">
                <div class="input-child">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="user_name" placeholder="John Doe" required>

                    <label for="email">Email Id:</label>
                    <input type="email" id="email" name="user_email" placeholder="john@yahoo.com" required>
                    <label for="phone-no">Phone Number</label>
                    <div class="phone-input">
                        <select name="country_code" class="phone-input-select" required>
                            <option selected disabled>code</option>
                            <option value="+213">+213</option>
                            <option value="+91">+91</option>
                            <option value="+244">+244</option>
                            <option value="+61">+61</option>
                        </select>
                        <input type="tel" id="phone-no" name="phone_no" maxlength="10"  placeholder="9964728462">
                    </div>

                    <label for="select-service">Select Service</label>
                    <select id="select-service" name="service_type" required>
                        <option selected disabled>--Select--</option>
                        <option value="preventive-maintenance">Preventive Maintenance Service</option>
                        <option value="body-repair">Body Repair Service</option>
                        <option value="car-care">Car Care Service</option>
                    </select>
                    
                        <label for="car-make">Car Make</label>
                        <input type="text" id="car-make" name="car_make" placeholder="Suzuki, Toyota....">

                        <label for="car-model">Car Model</label>
                        <input type="text" id="car-model" name="car_model" placeholder="Alto, Innova..">
                    
                        <p>Fuel Type</p>
                    <div class="radio-group">
                        <input type="radio" id="petrol-type" name="fuel" value="Petrol">
                        <label for="petrol-type">Petrol</label>
                        
                        <input type="radio" id="diesel-type" name="fuel" value="Diesel">
                        <label for="diesel-type">Diesel</label>
                        
                        <input type="radio" id="other-type" name="fuel" value="Other">
                        <label for="other-type">Others</label>

                    </div>
                    <label for="kilometer-ran">Kilometer Ran</label>
                    <input type="number" id="kilometer-ran" name="km_ran" placeholder=" __km">
                    
                </div>
                <div class="image-child">
                    <img src="/assets/booking.jpg" alt="booking-and-phone">
                </div>
            </div>
            <div class="btn">
                <input type="submit" formaction="booking-success.html" id="appointment-btn" value="Schedule Your Appointment">
            </div>
        </form>
    </main>
    <footer>
        Copyright &copy; 2020 AutoMob-Mechanic. All Rights Reserved.
    </footer>
</body>
</html>
